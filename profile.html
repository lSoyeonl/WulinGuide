<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Руководство 9 Инь</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261004-2216">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="auth.js?v=20261004-2125"></script>
</head>
<body class="wuxia-site-v5 wuxia-site-v44 wuxia-site-v45 profile-page-v1">
  <div class="mist-layer-v26" aria-hidden="true"></div>
  <div class="ash-layer-v26" aria-hidden="true"></div>
  <div class="ember-layer-v26" aria-hidden="true"></div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Руководство 9 Инь">
        <span class="round-brand-icon v40-brand-image" aria-hidden="true"><img src="images/brand-scroll-icon.png" alt=""></span>
        <span class="brand-copy"><strong>Руководство 9 Инь</strong><small>БАЗА ЗНАНИЙ</small></span>
      </a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="taiwan.html">Тайвань</a>
        <a href="pirate.html">Пиратка</a>
        <a href="profile.html" data-account-link>Личный кабинет</a>
      </nav>
    </div>
  </header>
  <main class="profile-shell-v1">
    <section class="profile-card-v1 profile-card-v2">
      <div class="profile-layout-v2">
        <aside class="profile-left-v2">
          <div class="profile-section-title-v6">ЛИЧНЫЙ КАБИНЕТ</div>

          <div class="profile-avatar-wrap-v1">
            <img id="profile-avatar-v1" src="images/default-profile.webp" alt="Аватар пользователя">
            <label class="profile-avatar-button-v1" for="profile-avatar-input-v1">Изменить аватар</label>
            <input id="profile-avatar-input-v1" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <button id="profile-avatar-reset-v1" class="profile-avatar-reset-v1" type="button">Вернуть стандартный</button>
          </div>
        </aside>

        <div class="profile-right-v2">
          <div class="profile-info-grid-v1 profile-info-grid-v2">
            <div class="profile-field-v1 profile-field-wide-v2"><span>Имя пользователя</span><strong id="profile-login-v1">—</strong></div>
            <div class="profile-field-v1 profile-field-wide-v2"><span>Электронная почта</span><strong id="profile-email-v1">—</strong></div>
            <div class="profile-field-v1 profile-server-edit-v2">
              <span>Сервер</span>
              <div class="profile-server-row-v2">
                <select id="profile-server-select-v2" aria-label="Сервер">
                  <option value="taiwan">Тайвань</option>
                  <option value="pirate_china">Пиратка Китай</option>
                  <option value="private_dubu">Приват Дубу</option>
                  <option value="china">Китай</option>
                </select>
                <button id="profile-server-save-v2" type="button">Сохранить</button>
              </div>
            </div>
          </div>

          <div class="profile-about-v2">
            <div class="profile-about-head-v2">
              <div>
                <span>О СЕБЕ</span>
                <small>Видит только владелец аккаунта</small>
              </div>
              <span id="profile-about-count-v2">0 / 800</span>
            </div>
            <textarea id="profile-about-v2" maxlength="800" placeholder="Расскажите немного о себе..."></textarea>
            <div class="profile-about-actions-v2">
              <button id="profile-about-save-v2" type="button">Сохранить описание</button>
            </div>
          </div>

          <p id="profile-message-v1" class="auth-message-v1" aria-live="polite"></p>
          <div class="profile-actions-v1">
            <a class="profile-home-button-v1" href="index.html">Вернуться на главную</a>
            <button id="profile-logout-v1" type="button">Выйти из аккаунта</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer-v44"><div class="footer-inner-v44"><span class="footer-title-v46">Руководство 9 Инь 2026</span></div></footer>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = window.WulinGuideAuth;
      if (!auth) return;
      const message = document.getElementById('profile-message-v1');
      const avatar = document.getElementById('profile-avatar-v1');
      const input = document.getElementById('profile-avatar-input-v1');
      const reset = document.getElementById('profile-avatar-reset-v1');
      const about = document.getElementById('profile-about-v2');
      const aboutCount = document.getElementById('profile-about-count-v2');
      const aboutSave = document.getElementById('profile-about-save-v2');
      const serverSelect = document.getElementById('profile-server-select-v2');
      const serverSave = document.getElementById('profile-server-save-v2');
      const updateAboutCount = () => {
        aboutCount.textContent = `${about.value.length} / 800`;
      };
      try {
        const session = await auth.getSession();
        if (!session?.user) return;
        const profile = await auth.getProfile(session.user.id);
        const username = profile.username || 'Профиль';
        document.getElementById('profile-login-v1').textContent = username;
        document.getElementById('profile-email-v1').textContent = session.user.email || '—';
        serverSelect.value = profile.server || 'taiwan';
        avatar.src = auth.getAvatarUrl(profile);
        about.value = profile.about_me || '';
        updateAboutCount();
      } catch (err) {
        message.textContent = String(err?.message || 'Не удалось загрузить профиль.');
      }
      input.addEventListener('change', async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        message.textContent = 'Загрузка аватара…';
        try {
          avatar.src = await auth.uploadAvatar(file) + `?v=${Date.now()}`;
          message.textContent = 'Аватар обновлён.';
        } catch (err) {
          message.textContent = String(err?.message || 'Не удалось загрузить аватар.');
        } finally {
          input.value = '';
        }
      });
      reset.addEventListener('click', async () => {
        message.textContent = 'Возвращаем стандартный аватар…';
        try {
          avatar.src = await auth.resetAvatar();
          message.textContent = 'Стандартный аватар восстановлен.';
        } catch (err) {
          message.textContent = String(err?.message || 'Не удалось восстановить аватар.');
        }
      });
      serverSave.addEventListener('click', async () => {
        serverSave.disabled = true;
        serverSave.textContent = 'Сохраняем…';
        message.textContent = '';
        try {
          await auth.saveServer(serverSelect.value);
          message.textContent = 'Сервер сохранён.';
        } catch (err) {
          message.textContent = String(err?.message || 'Не удалось сохранить сервер.');
        } finally {
          serverSave.disabled = false;
          serverSave.textContent = 'Сохранить';
        }
      });
      about.addEventListener('input', updateAboutCount);
      aboutSave.addEventListener('click', async () => {
        aboutSave.disabled = true;
        aboutSave.textContent = 'Сохраняем…';
        message.textContent = '';
        try {
          const saved = await auth.saveAboutMe(about.value);
          about.value = saved;
          updateAboutCount();
          message.textContent = 'Описание сохранено.';
        } catch (err) {
          message.textContent = String(err?.message || 'Не удалось сохранить описание.');
        } finally {
          aboutSave.disabled = false;
          aboutSave.textContent = 'Сохранить описание';
        }
      });
      document.getElementById('profile-logout-v1').addEventListener('click', () => auth.signOut());
    });
  </script>
</body>
</html>
